name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So the workflow can be run by hand from the Actions tab, including on a
  # branch that has no pull request open yet.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # -warnaserror holds CI to the zero-warning bar AGENTS.md asks for.
      # Release rather than Debug so the tests run against what would ship.
      - name: Build
        run: dotnet build --configuration Release -warnaserror

      - name: Test
        run: dotnet test --configuration Release --no-build --logger 'console;verbosity=normal'
